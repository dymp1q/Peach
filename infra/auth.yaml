AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  Sign-in for the Spry site (lab 4): a Cognito user pool where people sign up
  with an email and a password or continue with Google, Cognito's managed login
  page on a prefix domain, and the public web client the browser signs in
  through. Deployed by scripts/deploy-auth.sh (make deploy-auth).

  Google never talks to the site: the site talks to Cognito, and Cognito talks
  to Google. Either way the browser comes back with Cognito tokens.

  Free for this project: the Essentials tier covers 10,000 monthly active users,
  and Cognito's built-in mailer sends up to 50 emails a day.

Parameters:
  ProjectName:
    Type: String
    Default: peach
    AllowedPattern: "[a-z0-9-]+"

  DomainPrefix:
    Type: String
    AllowedPattern: "[a-z0-9-]+"
    Description: >-
      Managed login lives at https://<prefix>.auth.<region>.amazoncognito.com.
      The Google OAuth client's origin and redirect URI point here, so the
      prefix is chosen before the Google client is created.

  CallbackUrls:
    Type: CommaDelimitedList
    Description: >-
      Where Cognito may send the browser back with a code. Must match the
      frontend's redirect_uri exactly, trailing slash included.

  LogoutUrls:
    Type: CommaDelimitedList
    Description: Where Cognito may send the browser after signing out.

  GoogleClientId:
    Type: String
    Description: The Web application OAuth client from Google Cloud.

  GoogleClientSecret:
    Type: String
    NoEcho: true
    Description: >-
      Its secret. Comes from the gitignored .env and lives only in Cognito: it
      is never in the repository or in the frontend bundle.

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${ProjectName}-users"
      # Managed login needs Essentials; the first 10,000 monthly users are free.
      UserPoolTier: ESSENTIALS
      # People sign in with their email, not a separate username.
      UsernameAttributes: [email]
      # Cognito emails a confirmation code to prove the address is theirs.
      AutoVerifiedAttributes: [email]
      UsernameConfiguration:
        CaseSensitive: false
      # Self sign-up stays on, so anyone - the lecturer included - can register.
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      # Cognito's own mailer: free, 50 emails a day. Enough for this lab; a
      # real product sends through Amazon SES.
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT
      UserPoolTags:
        PROJECT_NAME: !Ref ProjectName

  GoogleProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: openid email profile
      # Without the mapping a Google user arrives with no email, and the
      # header has nothing to show.
      AttributeMapping:
        email: email
        email_verified: email_verified
        name: name

  WebClient:
    Type: AWS::Cognito::UserPoolClient
    # A client that names a provider which does not exist yet fails to create.
    DependsOn: GoogleProvider
    Properties:
      ClientName: !Sub "${ProjectName}-web"
      UserPoolId: !Ref UserPool
      # A public client: a browser cannot keep a secret, so it gets none. PKCE
      # protects the code exchange instead.
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      SupportedIdentityProviders: [COGNITO, Google]
      CallbackURLs: !Ref CallbackUrls
      LogoutURLs: !Ref LogoutUrls
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      # "No such user" and "wrong password" look the same to a stranger.
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  Domain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Ref DomainPrefix
      # Version 2 is the new managed login (version 1 is the classic hosted UI).
      ManagedLoginVersion: 2

  # Without a branding a version 2 domain has no sign-in page to show.
  LoginBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    DependsOn: Domain
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref WebClient
      UseCognitoProvidedValues: true

Outputs:
  UserPoolId:
    Value: !Ref UserPool

  ClientId:
    Value: !Ref WebClient

  Authority:
    Description: The OIDC issuer the frontend's library discovers endpoints from.
    Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"

  CognitoDomain:
    Description: Managed login, and the base of the /logout endpoint.
    Value: !Sub "https://${DomainPrefix}.auth.${AWS::Region}.amazoncognito.com"

  GoogleRedirectUri:
    Description: Paste into the Google OAuth client's authorised redirect URIs.
    Value: !Sub "https://${DomainPrefix}.auth.${AWS::Region}.amazoncognito.com/oauth2/idpresponse"
