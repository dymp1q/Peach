AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Sign-in for the app: a Cognito user pool (email + password), its hosted
  domain, and the public web client the browser signs in through. Google is
  added as an identity provider when a Google OAuth client is supplied.

Parameters:
  ProjectName:
    Type: String
    Default: peach
    AllowedPattern: "[a-z0-9-]+"

  DomainPrefix:
    Type: String
    Description: >-
      The hosted domain is <prefix>.auth.<region>.amazoncognito.com. Globally
      unique, so the deploy script appends the account id.

  CallbackUrls:
    Type: CommaDelimitedList
    Description: Where the hosted domain may send the browser back after Google sign-in.

  LogoutUrls:
    Type: CommaDelimitedList

  GoogleClientId:
    Type: String
    Default: ""
    Description: An OAuth client from Google Cloud. Empty means email + password only.

  GoogleClientSecret:
    Type: String
    Default: ""
    NoEcho: true

Conditions:
  GoogleEnabled: !And
    - !Not [!Equals [!Ref GoogleClientId, ""]]
    - !Not [!Equals [!Ref GoogleClientSecret, ""]]

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${ProjectName}-users"
      # People sign in with their email; Cognito emails them a code to prove it.
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      UsernameConfiguration:
        CaseSensitive: false
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: name
          AttributeDataType: String
          Required: false
          Mutable: true
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireUppercase: false
          RequireSymbols: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      # Cognito's own mailer: free, 50 emails a day - plenty for a course project.
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT
      UserPoolTags:
        PROJECT_NAME: !Ref ProjectName

  Domain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref DomainPrefix
      UserPoolId: !Ref UserPool

  GoogleProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: GoogleEnabled
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: openid email profile
      AttributeMapping:
        email: email
        name: name
        email_verified: email_verified

  WebClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${ProjectName}-web"
      UserPoolId: !Ref UserPool
      # A browser cannot keep a secret, so the client has none. That is why the
      # API checks the token's audience: only tokens for this client count.
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      IdTokenValidity: 60
      AccessTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        IdToken: minutes
        AccessToken: minutes
        RefreshToken: days
      SupportedIdentityProviders: !If
        - GoogleEnabled
        - [COGNITO, !Ref GoogleProvider]
        - [COGNITO]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      CallbackURLs: !Ref CallbackUrls
      LogoutURLs: !Ref LogoutUrls

Outputs:
  UserPoolId:
    Value: !Ref UserPool
  ClientId:
    Value: !Ref WebClient
  Domain:
    Description: The hosted domain the browser is sent to for Google sign-in.
    Value: !Sub "${DomainPrefix}.auth.${AWS::Region}.amazoncognito.com"
  GoogleEnabled:
    Value: !If [GoogleEnabled, "true", "false"]
  GoogleRedirectUri:
    Description: The authorised redirect URI to register on the Google OAuth client.
    Value: !Sub "https://${DomainPrefix}.auth.${AWS::Region}.amazoncognito.com/oauth2/idpresponse"
