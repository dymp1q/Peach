AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  Paste an agenda (lab 6): an LLM parser on the side of Spry.
  (Kimi K2.5 by default; Claude once the account's quotas allow it.)

    browser --POST text + Cognito token--> agenda-parser (Lambda, function URL)
        --> a model on Amazon Bedrock (bedrock-mantle, us-east-1) --> JSON back
    browser --POST /api/meetings/{id}/agenda--> API (ECS) --> RDS     (the save)

  The parser needs no database, so it runs outside the VPC: it reaches
  Bedrock over the internet with no NAT and no interface endpoint, and costs
  nothing while nobody pastes anything. It never writes; saving goes through
  the API's usual validation. Deployed by scripts/deploy-ai.sh (make deploy-ai).

Parameters:
  ProjectName:
    Type: String
    Default: peach
    AllowedPattern: "[a-z0-9-]+"

  ImageUri:
    Type: String
    Description: The backend's image (the one ECS runs), started with the parser's handler.

  ParserModel:
    Type: String
    Default: moonshotai.kimi-k2.5
    Description: >-
      Any model on bedrock-mantle. anthropic.* goes through the Messages API,
      the rest through chat completions; this account's Claude quotas are 0.

  BedrockRegion:
    Type: String
    Default: us-east-1

  CognitoIssuer:
    Type: String
    Description: The lab 4 user pool's issuer, https://cognito-idp.<region>.amazonaws.com/<pool id>.

  CognitoClientId:
    Type: String
    Description: The web client whose access tokens the parser accepts.

  AllowedOrigins:
    Type: CommaDelimitedList
    Description: The site's origins, e.g. https://app.example.com,http://localhost:5173.

  BudgetEmail:
    Type: String
    Description: Who gets the $5-a-month budget alarm.

  BudgetLimitUsd:
    Type: Number
    Default: 5

Resources:
  ParserLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-agenda-parser"
      RetentionInDays: 14
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ParserRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        # Call a model - and nothing else: no database, no S3, no SES.
        # "*" is any model in any region; narrowing it is a class question.
        - PolicyName: call-bedrock
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: bedrock-mantle:CreateInference
                Resource: "*"
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ParserFunction:
    Type: AWS::Lambda::Function
    DependsOn: ParserLogGroup
    Properties:
      FunctionName: !Sub "${ProjectName}-agenda-parser"
      Description: Pasted text -> a suggested agenda, through Claude on Bedrock
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      ImageConfig:
        EntryPoint: ["/app/.venv/bin/python", "-m", "awslambdaric"]
        Command: ["app.ai.agenda_lambda.handler"]
        WorkingDirectory: /app
      Architectures: [arm64]
      MemorySize: 512
      # A parse takes 2-8 s; one retry after an invalid answer doubles it.
      Timeout: 30
      Role: !GetAtt ParserRole.Arn
      # No VpcConfig: this function never touches the database.
      Environment:
        Variables:
          APP_ENV: production
          PARSER_MODEL: !Ref ParserModel
          BEDROCK_REGION: !Ref BedrockRegion
          COGNITO_ISSUER: !Ref CognitoIssuer
          COGNITO_CLIENT_ID: !Ref CognitoClientId
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # A public HTTPS address for the function. AuthType NONE lets the browser
  # call it; the handler itself checks the Cognito token and answers 401.
  ParserUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt ParserFunction.Arn
      AuthType: NONE
      Cors:
        AllowOrigins: !Ref AllowedOrigins
        AllowMethods: [POST]
        AllowHeaders: [authorization, content-type]
        MaxAge: 3600

  # Both are needed for a public function URL: the first lets anyone use the
  # URL, the second lets that URL invoke the function.
  ParserUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ParserFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  ParserInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ParserFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  # The cheapest insurance in the course: an email once the whole account's
  # bill for the month passes the limit, and another when it is forecast to.
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub "${ProjectName}-monthly"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref BudgetLimitUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail

Outputs:
  ParserUrl:
    Description: The browser posts pasted text here (VITE_PARSER_URL).
    Value: !GetAtt ParserUrl.FunctionUrl

  ParserFunctionName:
    Value: !Ref ParserFunction
