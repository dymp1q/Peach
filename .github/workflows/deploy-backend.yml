name: Deploy backend

# Every push to main: lint and test the backend, then ship it to ECS - build
# the image, push it to ECR tagged with the commit SHA, and roll the ECS
# service to that tag. A red test never reaches the deploy job.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, and never cancel one halfway: an interrupted
# CloudFormation update is worse than a queued one.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  test:
    name: Lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # The tests run against a real Postgres, as they do in Compose.
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: peach
          POSTGRES_PASSWORD: peach
          POSTGRES_DB: peach
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U peach -d peach"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://peach:peach@localhost:5432/peach
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --frozen

      - name: ruff check
        run: uv run ruff check --output-format=github .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: migrations match the models
        run: uv run alembic upgrade head && uv run alembic check

      - name: pytest
        run: uv run pytest -q

  deploy:
    name: ECS
    needs: test
    # Skipped until make github-role has created the role and set this variable.
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    # Fargate runs the task on ARM64 (Graviton); an ARM runner builds the
    # image natively instead of under QEMU emulation.
    runs-on: ubuntu-24.04-arm
    permissions:
      # Required to fetch the OIDC token that AWS trades for the role. The job
      # holds no long-lived credentials.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-session-name: gha-deploy-backend-${{ github.run_id }}

      - uses: docker/setup-buildx-action@v3

      # The same target you run locally - CI has no recipe of its own.
      - name: Deploy
        run: make deploy-backend
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          # There is no .env here. Any parameter left empty keeps the stack's
          # current value, so a deploy from CI does not undo CORS or the domain.
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}
          IMAGE_TAG: ${{ github.sha }}

      - name: Summary
        if: always()
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name "${PROJECT_NAME:-peach}-backend-ecs" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text 2>/dev/null || echo "unknown")
          {
            echo "### Backend deploy"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| commit | \`${GITHUB_SHA}\` |"
            echo "| image tag | \`${GITHUB_SHA}\` |"
            echo "| api | ${API_URL} |"
            echo "| result | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}
